name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  # dependency-review consumes a pull-request diff and is intentionally unavailable on push;
  # verify runs deterministic strict Gradle dependency verification on every event.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review Gradle and Node dependency changes (PR-only)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firebase-tests/package-lock.json
      - name: Install Firebase test dependencies
        run: npm ci --prefix functions && npm ci --prefix firebase-tests
      - name: Verify Functions unit contracts on Node 22
        run: npm --prefix functions test
      - name: Verify canonical Firebase Rules 41 contract on Node 22
        run: npx --yes firebase-tools@15.20.0 emulators:exec --project demo-planterior --only firestore,storage 'npm --prefix firebase-tests test'
      - name: Verify Functions emulator and smoke contracts on Node 22
        env:
          STORAGE_BUCKET: demo-planterior.appspot.com
          FUNCTIONS_EMULATOR_APP_CHECK_DEBUG_TOKEN: planterior-emulator-app-check-v1
        run: |
          printf '%s\n' 'STORAGE_BUCKET=demo-planterior.appspot.com' \
            'FUNCTIONS_EMULATOR_APP_CHECK_DEBUG_TOKEN=planterior-emulator-app-check-v1' > functions/.env.local
          printf '%s\n' 'MINI_HOME_SHARE_TOKEN_KEY=emulator-share-token-key-for-tests' > functions/.secret.local
          trap 'rm -f functions/.env.local functions/.secret.local' EXIT
          npx --yes firebase-tools@15.20.0 emulators:exec --project demo-planterior --only auth,firestore,functions,storage 'npm --prefix functions run test:emulator && npx --yes node@22 --test firebase-tests/test/functions-smoke.cjs'
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Cache Gradle state
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up Go for pinned Gitleaks
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Install Gitleaks 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          GOBIN="$RUNNER_TEMP/gitleaks-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify security provenance, data-safety matrix, audits, and secrets
        run: scripts/test-security-provenance.sh && bash scripts/verify-data-safety.sh
      - name: Verify project
        run: ./gradlew projects spotlessCheck lintDebug testDebugUnitTest testReleaseUnitTest assembleDebug
      - name: Verify external release authentication contract
        run: scripts/test-release-auth-config.sh
