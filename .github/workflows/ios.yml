name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "ios/**"
      - ".swiftformat"
      - ".swiftlint.yml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen@2.46.0 swiftformat@0.62.1 swiftlint@0.65.0 gitleaks
      - name: Verify QA entrypoint modes
        run: |
          test -x ./ios/scripts/verify.sh
          test -x ./ios/scripts/qa-task.sh
      - run: ./ios/scripts/verify.sh
      - name: Operational privacy and accessibility gates
        shell: bash
        run: |
          simulator_id=
          simulator_created=0
          cleanup_simulator() {
            status=$?
            trap - EXIT INT TERM HUP
            if [ -n "$simulator_id" ]; then
              xcrun simctl shutdown "$simulator_id" 2>/dev/null || true
              if [ "$simulator_created" = "1" ]; then
                xcrun simctl delete "$simulator_id" 2>/dev/null || true
                if xcrun simctl list devices | grep -F "$simulator_id"; then
                  printf 'IOS_SIMULATOR_CLEANUP_FAILED id=%s\n' \
                    "$simulator_id" >&2
                  status=74
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup_simulator EXIT INT TERM HUP
          simulator_id=$(
            xcrun simctl list devices available --json |
              python3 -c '
          import json
          import sys

          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          device_type = "com.apple.CoreSimulator.SimDeviceType.iPhone-17"
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          matches = [
              device for device in devices
              if device.get("deviceTypeIdentifier") == device_type
          ]
          idle = next(
              (
                  device for device in matches
                  if device.get("state") == "Shutdown"
              ),
              None,
          )
          selected = idle or (matches[0] if matches else None)
          print(selected["udid"] if selected else "")
          '
          )
          if [ -z "$simulator_id" ]; then
            simulator_id=$(xcrun simctl create "CI iPhone 17" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17" \
              "com.apple.CoreSimulator.SimRuntime.iOS-26-5")
            simulator_created=1
          fi
          printf 'IOS_CI_SIMULATOR id=%s created=%s\n' \
            "$simulator_id" "$simulator_created"
          IOS_QA_SIMULATOR_ID="$simulator_id" \
            ./ios/scripts/qa-task.sh 19 \
            --attempt-dir "$RUNNER_TEMP/todo19"
