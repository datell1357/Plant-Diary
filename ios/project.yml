name: Planterior
options:
  bundleIdPrefix: com.planterior
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
packages:
  PlanteriorCore:
    path: Packages/PlanteriorCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Release.xcconfig
targets:
  Planterior:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planterior.helper
        PRODUCT_NAME: Planterior
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Planterior.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: PlanteriorCore
        products:
          - PlanteriorDomain
          - PlanteriorData
          - PlanteriorDesignSystem
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Provision Firebase configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ -n "$PLAN_FIREBASE_PLIST_PATH" ]; then
            test -f "$PLAN_FIREBASE_PLIST_PATH"
            mkdir -p "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH"
            cp "$PLAN_FIREBASE_PLIST_PATH" \
              "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/GoogleService-Info.plist"
          fi
    scheme:
      gatherCoverageData: true
      coverageTargets:
        - Planterior
      testTargets:
        - PlanteriorTests
        - PlanteriorUITests
  PlanteriorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PlanteriorTests
    dependencies:
      - target: Planterior
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planterior.helper.tests
        GENERATE_INFOPLIST_FILE: "YES"
  PlanteriorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PlanteriorUITests
    dependencies:
      - target: Planterior
      - package: PlanteriorCore
        product: PlanteriorTestingSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planterior.helper.uitests
        GENERATE_INFOPLIST_FILE: "YES"
